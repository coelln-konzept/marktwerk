name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: marktwerk
          POSTGRES_PASSWORD: marktwerk
          POSTGRES_DB: marktwerk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marktwerk" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://marktwerk:marktwerk@localhost:5432/marktwerk
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm build
