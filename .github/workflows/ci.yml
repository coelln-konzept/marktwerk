name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: marktwerk
          POSTGRES_PASSWORD: marktwerk
          POSTGRES_DB: marktwerk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marktwerk" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://marktwerk:marktwerk@localhost:5432/marktwerk
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm build

      # Integration tests: services against a real Postgres, in their own database so the
      # app database above stays untouched (apps/web/test, docs/development/testing.md).
      - name: Create test database
        run: psql "postgres://marktwerk:marktwerk@localhost:5432/postgres" -c 'create database marktwerk_test'
      - name: Migrate test database
        run: pnpm db:migrate
        env:
          DATABASE_MIGRATION_URL: postgres://marktwerk:marktwerk@localhost:5432/marktwerk_test
      - name: Integration tests
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgres://marktwerk:marktwerk@localhost:5432/marktwerk_test

  # Browser smoke test against the production build with the synthetic seed data.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: marktwerk
          POSTGRES_PASSWORD: marktwerk
          POSTGRES_DB: marktwerk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marktwerk" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://marktwerk:marktwerk@localhost:5432/marktwerk
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @marktwerk/web exec playwright install --with-deps chromium
      - name: Start the app
        run: |
          pnpm --filter @marktwerk/web start > next.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/api/health && exit 0
            sleep 2
          done
          cat next.log
          exit 1
      - name: Playwright smoke test
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            next.log
          retention-days: 7
