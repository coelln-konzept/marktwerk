<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>marktwerk · Phase 1 · Prototyp</title>
<meta name="description" content="Klickbarer Mid-Fidelity-Prototyp der Phase-1-Bildschirme von marktwerk.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap">
<style>
/* marktwerk · Phase 1 · Mid-Fi-Komponenten v2
   Themes: Hell (Standard) / Dunkel über .dark am Seitenwurzel-Element
   Dichte: Standard / .kompakt
   Raster: 4 px */
*{box-sizing:border-box}
body{margin:0}
:root,.light{
  --bg:#F7F6F3;--surface:#FFFFFF;--surface2:#FBFAF8;--sunken:#F0EEEA;--line:#E6E3DD;--line2:#EFEDE8;--line3:#D9D5CE;
  --ink:#1C1B19;--ink2:#55524C;--ink3:#6B675F;--ink4:#8E8A82;
  --accent:#0E5A62;--accent-h:#0A4A51;--accent-ink:#FFFFFF;--accent-bg:#E6F0F0;--accent-fg:#0E5A62;
  --hover:#F3F1EC;--sel:#EAF3F3;--scrim:rgba(28,27,25,.32);--shadow:rgba(28,27,25,.14);
  --ok:#1B6B36;--ok-bg:#E4F3E8;--ok-d:#2E9B50;
  --warn:#8A4B00;--warn-bg:#FDF0D9;--warn-d:#E0951A;
  --crit:#A3201A;--crit-bg:#FBE5E2;--crit-d:#C42A1F;
  --neut:#55524C;--neut-bg:#EEECE8;--neut-d:#9C978F;
  --info:#1A4F96;--info-bg:#E3ECF9;--info-d:#2F6FD0;
  --vio:#5B3A98;--vio-bg:#EEE8F8;--vio-d:#7B57C2;
  --floh:#8E3A5C;--floh-bg:#F6E7ED;--antik:#6B4C2C;--antik-bg:#F1E8DC;--stadt:#3B4B86;--stadt-bg:#E8EBF5;--food:#56632A;--food-bg:#EDF0DC;
  --row:40px;--fs:14px;--fs-sm:13px;--fs-xs:12px;--cell-y:8px;
  color-scheme:light;
}
.dark{
  --bg:#141412;--surface:#1D1C1A;--surface2:#232220;--sunken:#191817;--line:#35332F;--line2:#2B2A27;--line3:#46433E;
  --ink:#EDEBE6;--ink2:#BAB6AE;--ink3:#A29D95;--ink4:#7F7A72;
  --accent:#5DB7BE;--accent-h:#78C7CD;--accent-ink:#0B1F21;--accent-bg:#173A3D;--accent-fg:#7CCBD1;
  --hover:#272623;--sel:#1C3437;--scrim:rgba(0,0,0,.55);--shadow:rgba(0,0,0,.5);
  --ok:#86D9A0;--ok-bg:#16301E;--ok-d:#4CC173;
  --warn:#F2C26E;--warn-bg:#382910;--warn-d:#E8A93A;
  --crit:#FF9C90;--crit-bg:#3C1915;--crit-d:#F0645A;
  --neut:#C2BDB4;--neut-bg:#2C2B28;--neut-d:#8E8A82;
  --info:#95BEF6;--info-bg:#172842;--info-d:#5E95E6;
  --vio:#C9AEF5;--vio-bg:#2B2140;--vio-d:#A383E0;
  --floh:#EBA2C1;--floh-bg:#3A2030;--antik:#DDBC92;--antik-bg:#33281B;--stadt:#AEBBF0;--stadt-bg:#232A42;--food:#C8D584;--food-bg:#2A2F17;
  color-scheme:dark;
}
.kompakt{--row:32px;--fs:13px;--fs-sm:12px;--fs-xs:11.5px;--cell-y:4px}
.mw{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:var(--fs);line-height:1.45;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-feature-settings:'cv11'}
.mw button,.mw input,.mw select,.mw textarea{font:inherit;color:inherit}
.mw a{color:var(--accent-fg)}
.mw :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.app{display:flex;flex-wrap:wrap;min-height:100vh;position:relative;align-items:stretch;background:var(--bg);color:var(--ink)}
.side-slot{flex:0 0 232px;display:flex;flex-direction:column;position:relative;z-index:15}
.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column}
.content{padding:20px 28px 40px;display:flex;flex-direction:column;gap:20px}
.num,.tnum{font-variant-numeric:tabular-nums}
.h1{font-size:20px;line-height:1.25;font-weight:650;letter-spacing:-0.01em;margin:0}
.h2{font-size:15px;font-weight:620;margin:0}
.h3{font-size:12px;font-weight:650;margin:0;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--ink2)}
.faint{color:var(--ink3)}
.small{font-size:var(--fs-sm)}
.xs{font-size:var(--fs-xs)}
.strong{font-weight:620}
.prose{max-width:70ch;line-height:1.6}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sep{width:1px;height:20px;background:var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.panel-b{padding:16px}
.panel-f{padding:12px 16px;border-top:1px solid var(--line2);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
/* Icons (Sprite <use>) */
.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.i-sm{width:14px;height:14px}
.i-lg{width:20px;height:20px}
.ibox{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--neut-bg);color:var(--ink2)}
.ibox.fin{background:var(--crit-bg);color:var(--crit)}
.ibox.perm{background:var(--vio-bg);color:var(--vio)}
.ibox.task{background:var(--neut-bg);color:var(--ink2)}
.ibox.ret{background:var(--info-bg);color:var(--info)}
.ibox.time{background:var(--warn-bg);color:var(--warn)}
/* Status-Badge: Farbe + Icon + Text */
.b{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px 0 6px;border-radius:999px;font-size:var(--fs-xs);font-weight:600;white-space:nowrap;background:var(--neut-bg);color:var(--neut);line-height:1}
.kompakt .b{height:20px}
.b .i{width:14px;height:14px;stroke-width:2}
.b.ok{background:var(--ok-bg);color:var(--ok)}
.b.warn{background:var(--warn-bg);color:var(--warn)}
.b.crit{background:var(--crit-bg);color:var(--crit)}
.b.neut{background:var(--neut-bg);color:var(--neut)}
.b.info{background:var(--info-bg);color:var(--info)}
.b.vio{background:var(--vio-bg);color:var(--vio)}
.b.line{background:transparent;box-shadow:inset 0 0 0 1px var(--line3)}
.b.strike{text-decoration:line-through}
.roll{display:inline-flex;align-items:center;gap:2px;height:20px;padding:0 6px;border-radius:4px;background:var(--warn-bg);color:var(--warn);font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.roll .i{width:12px;height:12px;stroke-width:2.25}
/* Health: Form + Farbe + Text */
.hl{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-size:var(--fs-sm);font-variant-numeric:tabular-nums;color:var(--ink)}
.hl .i{width:14px;height:14px}
.hl.ok .i{color:var(--ok-d)}
.hl.warn .i{color:var(--warn-d)}
.hl.crit .i{color:var(--crit-d)}
.hl.neut .i{color:var(--neut-d)}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:32px;padding:4px 12px;border-radius:8px;border:1px solid var(--line3);background:var(--surface);color:var(--ink);font-weight:560;cursor:pointer;text-decoration:none;white-space:nowrap;line-height:1.2}
.mw a.btn{color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn-primary,.mw a.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-h)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--hover)}
.btn-sm{min-height:28px;padding:2px 8px;font-size:var(--fs-xs);border-radius:6px;gap:4px}
.kompakt .btn{min-height:28px}
.kompakt .btn-sm{min-height:24px}
.btn-lg{min-height:52px;padding:8px 20px;font-size:16px;border-radius:12px;font-weight:650}
.btn-icon{width:32px;padding:0}
.btn-sm.btn-icon{width:28px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.saving{opacity:.8;cursor:progress}
.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:16px;padding:0 4px;border:1px solid var(--line3);border-bottom-width:2px;border-radius:4px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line3);border-radius:8px;padding:2px;background:var(--sunken);gap:2px}
.seg button{min-height:28px;padding:2px 12px;border:0;border-radius:6px;background:transparent;font-weight:560;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px var(--shadow)}
/* Filter-Chips mit Zählern */
.chip{min-height:32px;padding:2px 12px;border-radius:999px;border:1px solid var(--line3);background:var(--surface);font-size:var(--fs-sm);font-weight:560;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .ct{font-variant-numeric:tabular-nums;font-weight:650;min-width:20px;height:20px;padding:0 4px;border-radius:999px;background:var(--neut-bg);color:var(--ink2);display:inline-grid;place-items:center;font-size:11.5px}
.chip.on .ct{background:rgba(255,255,255,.18);color:inherit}
.dark .chip.on .ct{background:rgba(0,0,0,.18)}
/* Tags: Veranstaltungsart (gedämpfte Identitätsfarben) */
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;font-size:var(--fs-xs);font-weight:620;white-space:nowrap}
.tag::before{content:'';width:8px;height:8px;border-radius:2px;background:currentColor;opacity:.85}
.tag.plain::before{display:none}
.t-floh{background:var(--floh-bg);color:var(--floh)}
.t-antik{background:var(--antik-bg);color:var(--antik)}
.t-stadt{background:var(--stadt-bg);color:var(--stadt)}
.t-food{background:var(--food-bg);color:var(--food)}
.t-cat{background:var(--neut-bg);color:var(--ink2)}
.t-cat::before{display:none}
.t-new{background:var(--info-bg);color:var(--info)}
.t-new::before{display:none}
.t-ph2{background:var(--neut-bg);color:var(--ink2);height:18px;font-size:10.5px}
.t-ph2::before{display:none}
.cnt{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--crit-d);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.dark .cnt{color:#1D0A08}
.cnt.grey{background:var(--neut-bg);color:var(--ink2)}
/* Avatar */
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;color:#2A2824;flex:none;box-shadow:0 0 0 2px var(--surface)}
.av-lg{width:32px;height:32px;font-size:12px}
.av-P{background:#E2D3F1}.av-J{background:#CDE4E6}.av-F{background:#EADFCB}.av-L{background:#D5E6CD}.av-D{background:#F4D2C3}.av-A{background:#F4D7E2}.av-K{background:#D4DAF0}
.av-none{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--ink4);color:var(--ink3)}
/* Lastbalken */
.load{height:8px;border-radius:4px;background:var(--neut-bg);overflow:hidden}
.load>i{display:block;height:100%;border-radius:4px;background:var(--ok-d);transition:width .45s ease}
.load.lw>i{background:var(--warn-d)}
.load.lc>i{background:var(--crit-d)}
/* Grid-Tabelle */
.scroll{overflow-x:auto}
.gt{display:flex;flex-direction:column}
.gtr{display:grid;grid-template-columns:var(--c);column-gap:12px;align-items:center;min-height:var(--row);padding:var(--cell-y) 12px;border-bottom:1px solid var(--line2);position:relative}
.gtr:last-child{border-bottom:0}
.gtr.gth{min-height:32px;font-size:var(--fs-xs);font-weight:600;color:var(--ink3);background:var(--surface2);border-bottom:1px solid var(--line);padding:4px 12px;white-space:nowrap;position:sticky;top:0;z-index:2}
.gtr .r{text-align:right;justify-self:end}
.gtr.hov:hover{background:var(--hover)}
.gtr.sel{background:var(--sel)}
.gtr.amber{background:var(--warn-bg)}
.gtr.red{background:var(--crit-bg)}
.gtr.done{color:var(--ink3)}
.gtr.new{background:var(--info-bg)}
.gtr.grp{background:var(--sunken);font-weight:620;font-size:var(--fs-xs);color:var(--ink2);min-height:32px;padding:4px 12px;grid-template-columns:1fr}
.gtr.sub{background:var(--surface2)}
.rowlink{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:620;color:var(--ink);min-width:0}
.rowlink:hover{text-decoration:underline}
.rowact{display:inline-flex;gap:4px;align-items:center;opacity:.5;transition:opacity .15s}
.gtr:hover .rowact,.gtr:focus-within .rowact,.due:hover .rowact,.due:focus-within .rowact,.card:hover .rowact,.card:focus-within .rowact,.rowact.show{opacity:1}
/* Tabs */
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tab{padding:8px 12px;font-weight:560;color:var(--ink2);border:0;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;text-decoration:none}
.mw a.tab{color:var(--ink2)}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:620}
/* Drawer, Vorschau, Side-Sheet, Dialog, Toast */
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-16px 0 40px var(--shadow);display:flex;flex-direction:column;z-index:20}
.drawer.wide{width:min(760px,100%)}
.drawer-h{padding:16px 20px 12px;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:8px}
.drawer-b{padding:16px 20px;display:flex;flex-direction:column;gap:20px}
.drawer-f{padding:12px 20px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:var(--surface2)}
.peek{position:absolute;top:72px;right:16px;width:min(380px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 48px var(--shadow);display:flex;flex-direction:column;z-index:25}
.peek-h{padding:12px 16px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line2)}
.peek-b{padding:12px 16px;display:flex;flex-direction:column;gap:12px}
.peek-f{padding:12px 16px;border-top:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.dl{display:grid;grid-template-columns:132px minmax(0,1fr);gap:8px 12px;align-items:center;margin:0}
.dl dt{color:var(--ink3);font-size:var(--fs-sm)}
.dl dd{margin:0}
.modal-back{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:64px 16px;z-index:30}
.modal{background:var(--surface);border-radius:12px;width:min(820px,100%);box-shadow:0 24px 64px var(--shadow);display:flex;flex-direction:column}
.modal-h{padding:20px 24px 12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.modal-b{padding:4px 24px 20px;display:flex;flex-direction:column;gap:16px}
.modal-f{padding:12px 24px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;background:var(--surface2);border-radius:0 0 12px 12px}
.toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:#1C1B19;color:#fff;border-radius:12px;padding:8px 8px 8px 16px;display:flex;gap:12px;align-items:center;z-index:40;box-shadow:0 12px 32px rgba(0,0,0,.28);font-weight:520;max-width:calc(100% - 32px)}
.dark .toast{background:#EDEBE6;color:#1C1B19}
.toast button{background:transparent;border:0;color:#9FD9DE;font-weight:650;cursor:pointer;min-height:32px;padding:0 8px;border-radius:6px;white-space:nowrap}
.dark .toast button{color:#0E5A62}
.toast button:hover{background:rgba(127,127,127,.18)}
.toast .tbar{position:absolute;left:12px;right:12px;bottom:4px;height:2px;border-radius:2px;background:rgba(159,217,222,.5)}
.banner{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 16px;border-radius:10px;flex-wrap:wrap;min-height:44px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.crit{background:var(--crit-bg);color:var(--crit)}
.banner.info{background:var(--info-bg);color:var(--info)}
.banner .btn{color:var(--ink)}
/* Menü (⋯) */
.menu{position:absolute;z-index:30;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px var(--shadow);padding:4px;display:flex;flex-direction:column}
.menu button,.menu a{display:flex;align-items:center;gap:8px;min-height:32px;padding:4px 8px;border:0;background:none;border-radius:6px;text-align:left;cursor:pointer;color:var(--ink);text-decoration:none;font-size:var(--fs-sm)}
.menu button:hover,.menu a:hover,.menu .on{background:var(--hover)}
.menu .mh{font-size:11px;color:var(--ink3);padding:8px 8px 4px;text-transform:uppercase;letter-spacing:.04em;font-weight:650}
.menu hr{border:0;border-top:1px solid var(--line2);margin:4px 0}
.menu .k{margin-left:auto}
/* Formulare */
.field{display:flex;flex-direction:column;gap:4px}
.field>label,.lbl{font-size:var(--fs-sm);font-weight:600;color:var(--ink)}
.kompakt .field{flex-direction:row;align-items:center;gap:12px}
.kompakt .field>label{flex:0 0 120px}
.kompakt .field>.inp{flex:1 1 auto}
.inp{min-height:36px;border:1px solid var(--line3);border-radius:8px;padding:4px 12px;background:var(--surface);min-width:0;color:var(--ink)}
.kompakt .inp{min-height:30px}
textarea.inp{padding:8px 12px;resize:vertical;line-height:1.5}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.inp.err{border-color:var(--crit-d);box-shadow:inset 0 0 0 1px var(--crit-d)}
.hint{font-size:var(--fs-xs);color:var(--ink3)}
.hint.err{color:var(--crit)}
.hint.warn{color:var(--warn)}
.check{display:flex;align-items:center;gap:8px}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.drop{border:1.5px dashed var(--line3);border-radius:10px;padding:16px;display:flex;align-items:center;gap:12px;background:var(--surface2);flex-wrap:wrap}
/* Kanban */
.kb{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;align-items:start}
.kcol{background:var(--sunken);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:520px;border:1.5px solid transparent}
.kcol.over{border-color:var(--accent);background:var(--accent-bg)}
.kcol-h{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 4px 8px;font-weight:620}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 4px;display:grid;grid-template-columns:20px minmax(0,1fr);gap:4px;position:relative;box-shadow:0 1px 0 var(--shadow)}
.card:hover{border-color:var(--line3)}
.card.ghost{opacity:.35;border-style:dashed}
.card.lift{transform:rotate(-2deg);box-shadow:0 18px 40px var(--shadow);border-color:var(--accent)}
.card.flash{box-shadow:0 0 0 2px var(--accent)}
.card.isdone .ctitle{color:var(--ink3);text-decoration:line-through}
.grip{width:20px;min-height:24px;display:grid;place-items:center;color:var(--ink4);cursor:grab;border:0;background:none;border-radius:4px;padding:0}
.grip:hover{background:var(--hover);color:var(--ink2)}
.cbody{display:flex;flex-direction:column;gap:8px;min-width:0}
.ctitle{font-weight:560;line-height:1.35;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink)}
.cmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--ink2)}
.tick{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ink4);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0;color:transparent;flex:none}
.tick:hover{border-color:var(--ok-d);color:var(--ok-d)}
.tick.on{background:var(--ok-d);border-color:var(--ok-d);color:#fff}
.person{display:flex;flex-direction:column;gap:8px;padding:8px 12px;border-radius:10px;border:1.5px solid transparent}
.person.dropok{border-color:var(--accent);background:var(--accent-bg);border-style:dashed}
.person.flash{background:var(--sel)}
/* Sidebar */
.side{flex:1 1 auto;width:232px;min-height:100vh;background:var(--sunken);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 8px;gap:2px;color:var(--ink);position:relative}
.brand{display:flex;align-items:center;gap:8px;padding:4px 8px 16px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand-mark{width:24px;height:24px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.nav{display:flex;align-items:center;gap:12px;min-height:32px;padding:4px 8px;border-radius:8px;text-decoration:none;font-weight:520}
.mw a.nav{color:var(--ink2)}
.nav:hover{background:var(--hover)}
.mw a.nav.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line);font-weight:620}
.nav .i{color:var(--ink3)}
.nav.on .i{color:var(--accent-fg)}
.nav.off{color:var(--ink4);cursor:not-allowed}
.nav .cnt,.nav .t-ph2{margin-left:auto}
.side-sec{font-size:11px;font-weight:650;color:var(--ink3);padding:12px 8px 4px;text-transform:uppercase;letter-spacing:.05em}
.me{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;border:0;background:none;cursor:pointer;width:100%;text-align:left;color:var(--ink)}
.me:hover{background:var(--hover)}
/* Topbar + Befehlspalette */
.top{min-height:56px;display:flex;align-items:center;gap:12px;padding:8px 28px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap;color:var(--ink)}
.search{flex:0 1 420px;min-height:36px;display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;border:1px solid var(--line3);border-radius:8px;background:var(--surface2);color:var(--ink3);cursor:text;text-align:left}
.search:hover{border-color:var(--ink4)}
.bell{position:relative}
.bell .cnt{position:absolute;top:-4px;right:-6px}
.only-m{display:none}
.pal-back{position:absolute;inset:0;background:var(--scrim);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:88px 16px}
.pal{width:min(640px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 64px var(--shadow);display:flex;flex-direction:column;overflow:hidden;color:var(--ink)}
.pal-in{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line2)}
.pal-in input{flex:1;border:0;outline:none;background:transparent;font-size:16px;min-width:0;color:var(--ink)}
.pal-list{max-height:440px;overflow:auto;padding:4px 8px 8px}
.pal-g{font-size:11px;font-weight:650;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;padding:12px 8px 4px}
.pal-it{display:flex;align-items:center;gap:12px;min-height:40px;padding:4px 8px;border-radius:8px;text-decoration:none}
.mw a.pal-it{color:var(--ink)}
.pal-it.on,.pal-it:hover{background:var(--sel)}
.pal-it mark{background:var(--warn-bg);color:inherit;border-radius:2px;padding:0 1px}
.pal-f{display:flex;gap:16px;flex-wrap:wrap;padding:8px 16px;border-top:1px solid var(--line2);background:var(--surface2);font-size:11.5px;color:var(--ink3)}
/* Kalender */
.cal{display:grid;grid-template-columns:28px repeat(7,minmax(0,1fr));gap:2px}
.cal .dh{font-size:11px;color:var(--ink3);text-align:center;padding:2px 0;font-weight:600}
.cal .kw{font-size:10.5px;color:var(--ink4);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.day{height:36px;border:0;border-radius:8px;background:transparent;cursor:pointer;font-variant-numeric:tabular-nums;font-weight:520;position:relative;color:var(--ink);padding:0}
.day:hover{background:var(--hover)}
.day.we{font-weight:650}
.day.hol{color:var(--crit)}
.day.hol::after{content:'';position:absolute;left:50%;top:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--crit-d)}
.day.on{background:var(--accent);color:var(--accent-ink)}
.day.busy{box-shadow:inset 0 -3px 0 var(--warn-d)}
.day.taken{box-shadow:inset 0 0 0 1.5px var(--crit-d)}
.day.empty{visibility:hidden}
.mcal{display:grid;grid-template-columns:40px repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.mcal>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:104px;padding:4px 8px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.mcal>div.out{background:var(--surface2);color:var(--ink4)}
.mcal>div.today{box-shadow:inset 0 0 0 2px var(--accent)}
.mcal .mh{background:var(--surface2);min-height:0;font-size:var(--fs-xs);font-weight:600;color:var(--ink3);padding:4px 8px}
.mcal .kwc{background:var(--surface2);min-height:0;font-size:11px;color:var(--ink3);align-items:center;justify-content:flex-start;padding-top:8px;font-variant-numeric:tabular-nums}
.ev{font-size:var(--fs-xs);font-weight:600;border-radius:6px;padding:2px 6px;display:flex;gap:4px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none}
/* Stepper */
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.step{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink3)}
.step b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--neut-bg);font-size:11px;color:var(--ink2)}
.step.on{color:var(--ink)}
.step.on b{background:var(--accent);color:var(--accent-ink)}
.step.ok b{background:var(--ok-d);color:#fff}
.steps .sx{color:var(--ink4)}
/* Matrix */
.mx{display:grid;min-width:1040px}
.mx>.c{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:8px 12px;min-height:var(--row);display:flex;align-items:center;background:var(--surface)}
.mx>.hd{position:sticky;top:0;z-index:3;background:var(--surface2);font-size:var(--fs-xs);font-weight:600;color:var(--ink3);min-height:32px}
.mx>.grp{position:sticky;top:0;z-index:3;background:var(--sunken);font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink2);min-height:28px}
.mx>.fc{position:sticky;left:0;z-index:2;background:var(--surface);box-shadow:1px 0 0 var(--line)}
.mx>.hd.fc,.mx>.grp.fc{z-index:4;background:var(--surface2)}
.mcell{display:flex;align-items:center;gap:4px;width:100%;min-height:32px;padding:4px 8px;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer;text-align:left;font-size:var(--fs-sm);color:var(--ink)}
.mcell:hover{background:var(--hover);border-color:var(--line3)}
.mcell .i{width:14px;height:14px;stroke-width:2.25}
.mcell.ok .i{color:var(--ok-d)} .mcell.crit{color:var(--crit)} .mcell.crit .i{color:var(--crit-d)} .mcell.vio .i{color:var(--vio-d)} .mcell.info .i{color:var(--info-d)} .mcell.warn{color:var(--warn)} .mcell.warn .i{color:var(--warn-d)} .mcell.neut{color:var(--ink3)}
.mcell.sel{background:var(--sel);border-color:var(--accent)}
/* Skeleton */
.sk{background:linear-gradient(90deg,var(--neut-bg) 0%,var(--line2) 50%,var(--neut-bg) 100%);background-size:200% 100%;animation:skp 1.4s ease-in-out infinite;border-radius:6px;height:12px}
@keyframes skp{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* Leere Zustände */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:56px 24px}
.empty .eico{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--neut-bg);color:var(--ink3)}
/* Liste „Heute fällig“ */
.due{display:grid;grid-template-columns:32px minmax(0,1fr) 120px 150px 96px 112px 64px;gap:12px;align-items:center;min-height:56px;padding:8px 16px;border-bottom:1px solid var(--line2)}
.kompakt .due{min-height:44px;padding:4px 16px}
.due:hover{background:var(--hover)}
.due.sel{background:var(--sel)}
.due.gone{opacity:.45}
.wk{display:grid;grid-template-columns:minmax(150px,1.5fr) repeat(5,minmax(80px,1fr));gap:12px;align-items:center;min-height:52px;padding:8px 16px;border-bottom:1px solid var(--line2);text-decoration:none}
.mw a.wk{color:var(--ink)}
.wk:hover{background:var(--hover)}
.wk.head{min-height:32px;font-size:var(--fs-xs);font-weight:600;color:var(--ink3);background:var(--surface2);padding:4px 16px}
/* Misc */
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:18px;font-weight:650;font-variant-numeric:tabular-nums}
.timeline{display:flex;flex-direction:column;gap:8px;border-left:2px solid var(--line2);padding-left:12px}
.ph{background:repeating-linear-gradient(135deg,var(--sunken) 0 8px,var(--line2) 8px 16px);border-radius:8px;display:grid;place-items:center;color:var(--ink2);font-size:12px;font-weight:560}
.gridcell{min-height:32px;border:1px solid transparent;border-radius:4px;padding:4px 8px;display:flex;align-items:center;cursor:cell;min-width:0}
.gridcell:hover{border-color:var(--line3)}
.gridcell.act{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--surface)}
.dcell{width:100%;height:28px;border:1px solid transparent;border-radius:4px;background:transparent;text-align:center;font-variant-numeric:tabular-nums;font-size:12px;padding:0;color:var(--ink)}
.dcell:hover{border-color:var(--line3)}
.dcell:focus{outline:none;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--surface)}
.dcell.err{background:var(--crit-bg);color:var(--crit);border-color:var(--crit-d);font-weight:700}
.dcell.warn{background:var(--warn-bg);color:var(--warn);font-weight:650}
@media (max-width:760px){
  .side-slot{display:none}
  .content{padding:16px 16px 32px}
  .top{padding:8px 12px}
  .hide-m{display:none}
  .only-m{display:inline-flex}
  .search{flex:1 1 auto}
  .drawer,.drawer.wide{width:100%}
  .due{grid-template-columns:32px minmax(0,1fr) 112px}
  .due .hide-m{display:none}
}

=\"12\" cy=\"12\" r=\"8.5\"><\/circle><path d=\"M12 7.5V12l3 2\"><\/path><\/symbol>\n  <\/defs><\/svg>\n  <div class=\"side-slot\"><dc-import name=\"Sidebar\" active=\"benachrichtigungen\" user=\"jonas\" theme=\"{{theme}}\" density=\"{{density}}\" on-theme=\"{{setTheme}}\" on-density=\"{{setDensity}}\" hint-size=\"232px,1000px\"><\/dc-import><\/div>\n  <main class=\"main\">\n    <dc-import name=\"Topbar\" crumb=\"Benachrichtigungen\" hint-size=\"100%,56px\"><\/dc-import>\n    <div class=\"content\" style=\"max-width: 1000px; width: 100%\">\n      <div class=\"row between wrap\" style=\"gap: 12px; align-items: flex-end\">\n        <div class=\"col\" style=\"gap: 4px\"><h1 class=\"h1\">Benachrichtigungen<\/h1><span class=\"small faint\">Nur Hinweise in marktwerk · nichts geht an das Platzteam<\/span><\/div>\n        <div class=\"row xs faint\" style=\"gap: 8px\"><span class=\"kbd\">E<\/span> erledigt <span class=\"kbd\">S<\/span> merken <span class=\"kbd\">H<\/span> später<\/div>\n      <\/div>\n      <div class=\"row wrap\" style=\"gap: 8px\" role=\"group\" aria-label=\"Filter\">\n        <sc-for list=\"{{chips}}\" as=\"c\" hint-placeholder-count=\"4\"><button type=\"button\" class=\"{{c.cls}}\" onClick=\"{{c.pick}}\" aria-pressed=\"{{c.on}}\">{{c.label}} <span class=\"ct\">{{c.n}}<\/span><\/button><\/sc-for>\n      <\/div>\n      <sc-for list=\"{{groups}}\" as=\"g\" hint-placeholder-count=\"3\">\n        <section class=\"col\" style=\"gap: 8px\" aria-label=\"{{g.name}}\">\n          <span class=\"h3\">{{g.name}} · {{g.n}}<\/span>\n          <div class=\"panel\">\n            <sc-for list=\"{{g.items}}\" as=\"n\" hint-placeholder-count=\"3\">\n              <div style=\"display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-bottom: 1px solid var(--line2); background: {{n.bg}}; flex-wrap: wrap\">\n                <span class=\"ibox {{n.box}}\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#{{n.icon}}\"><\/use><\/svg><\/span>\n                <div class=\"col grow\" style=\"gap: 4px; min-width: 240px\">\n                  <span class=\"row wrap\" style=\"gap: 8px\"><span class=\"strong\">{{n.t}}<\/span><sc-if value=\"{{n.hasB}}\"><span class=\"{{n.b.c}}\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#{{n.b.i}}\"><\/use><\/svg>{{n.b.t}}<\/span><\/sc-if><sc-if value=\"{{n.hasRoll}}\"><span class=\"roll\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-roll\"><\/use><\/svg>2<\/span><\/sc-if><sc-if value=\"{{n.star}}\"><span class=\"tag t-new\">gemerkt<\/span><\/sc-if><\/span>\n                  <span class=\"small muted prose\">{{n.body}}<\/span>\n                  <span class=\"xs faint num\">{{n.meta}}<\/span>\n                <\/div>\n                <div class=\"row wrap\" style=\"gap: 4px; flex: none\">\n                  <a class=\"btn btn-sm btn-ghost\" href=\"{{n.href}}\">Öffnen<\/a>\n                  <button class=\"btn btn-sm\" type=\"button\" onClick=\"{{n.done}}\"><svg class=\"i i-sm\" aria-hidden=\"true\"><use href=\"#s-done\"><\/use><\/svg>Erledigt<\/button>\n                  <button class=\"btn btn-sm btn-ghost\" type=\"button\" onClick=\"{{n.mark}}\" aria-pressed=\"{{n.star}}\"><svg class=\"i i-sm\" aria-hidden=\"true\"><use href=\"#i-star\"><\/use><\/svg>{{n.markT}}<\/button>\n                  <button class=\"btn btn-sm btn-ghost\" type=\"button\" onClick=\"{{n.later}}\"><svg class=\"i i-sm\" aria-hidden=\"true\"><use href=\"#i-clock\"><\/use><\/svg>Später<\/button>\n                <\/div>\n              <\/div>\n            <\/sc-for>\n          <\/div>\n        <\/section>\n      <\/sc-for>\n      <sc-if value=\"{{empty}}\"><div class=\"panel empty\"><span class=\"strong\">Keine Benachrichtigungen in diesem Filter.<\/span><button class=\"btn btn-sm\" type=\"button\" onClick=\"{{reset}}\">Filter zurücksetzen<\/button><\/div><\/sc-if>\n    <\/div>\n  <\/main>\n  <sc-if value=\"{{hasToast}}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"toast\" role=\"status\" aria-           h('div', { style: { font: '700 11px/1 Inter, system-ui', letterSpacing: '.05em', textTransform: 'uppercase', color: '#6B675F', padding: '8px 8px 4px' } }, g.title),
          g.items.map(function (it) {
            var on = it.name === screen;
            return h('a', { key: it.name, href: '#' + it.name, style: { display: 'block', padding: '6px 8px', borderRadius: '6px', textDecoration: 'none', color: '#1C1B19', background: on ? '#EAF3F3' : 'transparent', fontWeight: on ? 650 : 450 } }, it.title);
          }));
      })) : null;
    return h(R.Fragment, null,
      C ? h(C, { key: screen }) : h('p', null, 'Bildschirm nicht gefunden'),
      nav,
      h('button', { type: 'button', style: NAV_BTN, onClick: function () { setOpen(!open); }, 'aria-expanded': open }, open ? 'Schließen' : 'Bildschirme (' + META.count + ')'));
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
