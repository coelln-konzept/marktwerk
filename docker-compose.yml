# Local development services. Postgres major version matches production (Scalingo, ADR 0006).
name: marktwerk

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: marktwerk
      POSTGRES_PASSWORD: marktwerk
      POSTGRES_DB: marktwerk
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marktwerk -d marktwerk"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches all outgoing email in dev. UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
